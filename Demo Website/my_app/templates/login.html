<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login Account</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body { background-color: #f0f2f5; }
      .login-card { max-width: 400px; margin: 80px auto; border: none; border-radius: 10px; }
      .btn-login { background-color: #0d6efd; border: none; font-weight: bold; }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand text-primary fw-bold" href="{% url 'home_page' %}">Quit</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item"><a class="nav-link" href="{% url 'home_page' %}">Home</a></li>
            <li class="nav-item"><a class="nav-link active fw-bold" href="{% url 'login_page' %}">Login</a></li>
            <li class="nav-item"><a class="nav-link" href="{% url 'register_page' %}">Register</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <div class="container">
      <div class="card login-card shadow-lg">
        <div class="card-body p-4">
          <h2 class="text-center mb-4">Login Account</h2>
          
          <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
              {{ form_data.as_p }}
            </div>

            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-primary btn-login py-2">Login</button>
            </div>
          </form>

          <div class="mt-4 text-center">
            <p class="small text-muted">Don't have an account? <a href="{% url 'register_page' %}" class="text-decoration-none fw-bold">Sign Up</a></p>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
