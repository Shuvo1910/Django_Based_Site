{% extends 'master/base.html' %}
{% block content %}
  <div class="card" style="width: 18rem;">
    {% if product_data.image %}
      <img src="{{ product_data.image.url }}" class="card-img-top" alt="..." />
    {% else %}
      No Preview
    {% endif %}

    <div class="card-body">
      <h5 class="card-title">{{ product_data.product_name }}</h5>
      <p class="card-text">{{ product_data.description }}</p>
      <a href="#" class="btn btn-primary">{{ product_data.price }}</a>
    </div>
  </div>
{% endblock %}
